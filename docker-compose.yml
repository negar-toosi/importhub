
services:
  db:
    container_name: importhub_postgres
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "5430:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: importhub_redis
    ports:
      - "6381:6379"
    networks:
      - db
    restart: unless-stopped
  worker:
    container_name: importhub_worker
    build: .
    command: celery -A src.infrastructure.celery.setup worker --loglevel=info
    depends_on:
      - redis
      - db
    networks:
      - db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_BACKEND_URL: ${CELERY_BACKEND_URL}
    volumes:
      - uploads:/importhub/importhub_uploads

  web:
    container_name: importhub_web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_BACKEND_URL: ${CELERY_BACKEND_URL}
    volumes:
      - uploads:/importhub/importhub_uploads

networks:
  db:
    driver: bridge

volumes:
  db:
  uploads:
